<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacaciones Brasil 2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        .bg-login-gradient {
            background: linear-gradient(135deg, #1e40af 0%, #38bdf8 100%);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

<div x-data="gestorApp()" x-init="init()" x-cloak>

    <template x-if="!isAuthenticated">
        <div class="fixed inset-0 bg-login-gradient flex items-center justify-center p-4 z-50">
            <div class="bg-white/10 backdrop-blur-sm p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20 text-center relative overflow-hidden">
                
                <div class="absolute -bottom-10 -left-10 text-white/10 opacity-50">
                    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M0 100 C 20 120, 40 120, 60 100 S 100 80, 120 100 S 160 120, 180 100 S 200 80, 200 80 V 200 H 0 V 100 Z" fill="currentColor"></path></svg>
                </div>

                <h1 class="text-4xl font-bold text-white mb-6 font-serif tracking-tight">Vacaciones Brasil 2027</h1>

                <div class="flex justify-center mb-8">
                    <div class="w-32 h-32 rounded-full border-4 border-amber-300 shadow-xl overflow-hidden bg-sky-100 flex items-center justify-center relative">
                        <div class="absolute inset-0">
                            <div class="absolute inset-0 bg-sky-400"></div>
                            <div class="absolute bottom-0 left-0 right-0 h-1/3 bg-amber-200"></div>
                            <div class="absolute bottom-6 left-1/4 w-8 h-12 bg-emerald-700 rounded-t-full shadow-md"></div>
                            <div class="absolute bottom-6 left-1/2 w-10 h-16 bg-emerald-800 rounded-t-full shadow-md -ml-2"></div>
                            <div class="absolute bottom-6 right-4 text-emerald-900">
                                <i data-lucide="palm-tree" class="w-10 h-10"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <form @submit.prevent="login" class="space-y-6 relative z-10">
                    <template x-if="loginError">
                        <div class="bg-red-500/80 text-white text-xs p-2 rounded-lg font-bold" x-text="loginError"></div>
                    </template>

                    <div class="text-left">
                        <label class="block text-xs font-bold text-white uppercase tracking-wider mb-1">Usuario</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input type="text" x-model="credentials.user" class="w-full pl-10 pr-4 py-3 bg-white rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-300 outline-none text-slate-800" placeholder="Ej: Drpereyra" required>
                        </div>
                    </div>

                    <div class="text-left">
                        <label class="block text-xs font-bold text-white uppercase tracking-wider mb-1">Contraseña</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input type="password" x-model="credentials.password" class="w-full pl-10 pr-4 py-3 bg-white rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-300 outline-none text-slate-800" placeholder="••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 font-black py-4 rounded-xl transition duration-200 shadow-lg uppercase tracking-widest">
                        INGRESAR
                    </button>
                </form>

                <p class="text-[10px] text-white/50 mt-10 relative z-10">Acceso Privado - © 2026</p>
            </div>
        </div>
    </template>


    <template x-if="isAuthenticated">
        <div class="max-w-5xl mx-auto p-4 md:p-8">
            
            <header class="bg-green-600 p-6 rounded-2xl text-white shadow-lg mb-8 relative overflow-hidden">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-white/20 pb-4 mb-4 gap-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <i data-lucide="palm-tree" class="w-8 h-8 text-amber-300"></i>
                            <h1 class="text-3xl font-bold italic">Vacaciones 2027 - Brasil 🇧🇷</h1>
                        </div>
                        <p class="opacity-90 font-medium">Contabilidad: Mayo 2026 - Diciembre 2026 (Base de Datos Online)</p>
                    </div>

                    <div class="flex flex-col items-end gap-3">
                        <div class="flex items-center gap-2 bg-black/20 px-3 py-1 rounded-full text-xs">
                            <i data-lucide="user-check" class="w-4 h-4 text-amber-300"></i>
                            <span x-text="currentUser"></span>
                            <button @click="logout" class="text-white/70 hover:text-red-300 ml-2 font-bold">Salir</button>
                        </div>

                        <div class="flex gap-2">
                            <button @click="exportarDatos" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition shadow-md border border-red-400">
                                <i data-lucide="download" class="w-4 h-4"></i> EXPORTAR
                            </button>
                            <label class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition shadow-md border border-red-400 cursor-pointer">
                                <i data-lucide="upload" class="w-4 h-4"></i> IMPORTAR
                                <input type="file" class="hidden" @change="importarDatos($event)" accept=".json">
                            </label>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex gap-6 text-sm font-semibold justify-center md:justify-start bg-black/10 p-3 rounded-xl inline-flex w-full md:w-auto">
                        <div class="flex items-center">
                            <span class="w-3 h-3 bg-white/50 rounded-full mr-2"></span>
                            Efectivo: <span class="ml-1 font-mono" x-text="formatearMoneda(totalEfectivo)"></span>
                        </div>
                        <div class="flex items-center border-l border-white/20 pl-6 font-mono">
                            <span class="w-3 h-3 bg-white/50 rounded-full mr-2"></span>
                            BELO: <span class="ml-1" x-text="formatearMoneda(totalBelo)"></span>
                        </div>
                    </div>
                    
                    <div class="text-right">
                        <span class="text-xs uppercase tracking-widest block opacity-80 font-bold">Total Recaudado</span>
                        <span class="text-4xl font-black text-amber-300" x-text="formatearMoneda(totalGeneral)"></span>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-1 space-y-6">
                    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                            <i data-lucide="plus-circle" class="text-green-600"></i> Registrar
                        </h2>
                        <form @submit.prevent="agregarIngreso">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase">Rubro</label>
                                    <select x-model="nuevo.rubro" class="w-full mt-1 border-slate-300 rounded-lg shadow-sm p-2 border" required>
                                        <template x-for="(config, rubro) in rubros" :key="rubro">
                                            <option :value="rubro" x-text="rubro"></option>
                                        </template>
                                    </select>
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase">Medio de Pago</label>
                                    <div class="grid grid-cols-2 gap-2 mt-1">
                                        <button type="button" @click="nuevo.medio = 'Efectivo'" 
                                            :class="nuevo.medio === 'Efectivo' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'"
                                            class="py-2 rounded-lg text-xs font-bold transition">EFECTIVO</button>
                                        <button type="button" @click="nuevo.medio = 'BELO'" 
                                            :class="nuevo.medio === 'BELO' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'"
                                            class="py-2 rounded-lg text-xs font-bold transition">BELO</button>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase">Fecha</label>
                                        <input type="date" x-model="nuevo.fecha" min="2026-05-01" max="2026-12-31" class="w-full mt-1 border-slate-300 rounded-lg shadow-sm p-2 border text-xs" required>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase">Monto</label>
                                        <input type="number" x-model.number="nuevo.monto" step="0.01" class="w-full mt-1 border-slate-300 rounded-lg shadow-sm p-2 border text-xs font-mono" placeholder="0.00" required>
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                                    Registrar Ingreso
                                </button>
                            </div>
                        </form>
                    </section>

                    <!-- Sección de Gestión de Metas (Edición, Agregar y Botón Guardar Metas) -->
                    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-bold flex items-center gap-2">
                                <i data-lucide="target" class="text-red-500"></i> Metas
                            </h2>
                            <button @click="guardarDatos" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">
                                Guardar Metas
                            </button>
                        </div>

                        <!-- Lista de metas actuales para editar -->
                        <div class="space-y-3 max-h-60 overflow-y-auto pr-1">
                            <template x-for="(config, rubro) in rubros" :key="rubro">
                                <div class="flex items-center justify-between gap-2 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                    <div class="flex flex-col flex-1 truncate">
                                        <span class="text-[11px] font-bold text-slate-700 truncate" x-text="rubro"></span>
                                    </div>
                                    <input type="number" x-model.number="rubros[rubro].meta" class="w-20 text-right text-xs border-slate-200 rounded p-1 border font-mono">
                                    <button @click="eliminarMeta(rubro)" title="Eliminar Meta" class="text-red-400 hover:text-red-600 font-bold px-1 text-sm">✕</button>
                                </div>
                            </template>
                        </div>

                        <hr class="border-slate-100">

                        <!-- Formulario para agregar una nueva meta -->
                        <div class="space-y-2 pt-1">
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Agregar Nueva Meta</span>
                            <input type="text" x-model="nuevaMetaNombre" placeholder="Nombre del rubro" class="w-full text-xs border-slate-300 rounded-lg p-2 border">
                            <div class="flex gap-2">
                                <input type="number" x-model.number="nuevaMetaMonto" placeholder="Monto meta" class="w-full text-xs border-slate-300 rounded-lg p-2 border font-mono">
                                <button @click="agregarMeta" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition shadow">
                                    + Agregar
                                </button>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="lg:col-span-2 space-y-6">
                    
                    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-xl font-bold mb-6">Estado de Ahorros</h2>
                        <div class="space-y-8">
                            <template x-for="(config, rubro) in rubros" :key="rubro">
                                <div>
                                    <div class="flex justify-between mb-2 items-end">
                                        <span class="font-bold text-slate-700 text-sm" x-text="rubro"></span>
                                        <span class="text-xs font-mono">
                                            <span class="font-bold text-slate-900" x-text="formatearMoneda(config.acumulado)"></span>
                                            <span class="text-slate-400">/ <span x-text="formatearMoneda(config.meta)"></span></span>
                                        </span>
                                    </div>
                                    <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden shadow-inner">
                                        <div :class="config.color || 'bg-blue-500'" 
                                             class="h-full rounded-full transition-all duration-1000 ease-out"
                                             :style="`width: ${Math.min((config.acumulado / config.meta) * 100, 100)}%`"
                                        ></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </section>

                    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                            <h2 class="text-xl font-bold">Historial de Movimientos</h2>
                            <i data-lucide="history" class="text-slate-300"></i>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 text-slate-400 uppercase text-[10px]">
                                    <tr>
                                        <th class="py-3 px-6">Fecha</th>
                                        <th class="py-3 px-4">Rubro / Medio</th>
                                        <th class="py-3 px-4 text-right">Monto</th>
                                        <th class="py-3 px-4 text-center">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(item, index) in historial" :key="index">
                                        <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition">
                                            <td class="py-4 px-6 font-mono text-slate-500" x-text="formatearFecha(item.fecha)"></td>
                                            <td class="py-4 px-4">
                                                <div class="flex flex-col">
                                                    <span class="font-bold text-slate-700" x-text="item.rubro"></span>
                                                    <span :class="item.medio === 'BELO' ? 'text-indigo-600' : 'text-slate-400'" 
                                                          class="text-[10px] font-black uppercase tracking-wider" 
                                                          x-text="item.medio"></span>
                                                </div>
                                            </td>
                                            <td class="py-4 px-4 text-right font-bold text-slate-900 font-mono" x-text="formatearMoneda(item.monto)"></td>
                                            <td class="py-4 px-4 text-center">
                                                <button @click="eliminarIngreso(index)" class="w-8 h-8 rounded-full hover:bg-red-50 text-red-300 hover:text-red-500 transition">✕</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <template x-if="historial.length === 0">
                                <div class="p-8 text-center text-slate-400 italic text-sm">No hay registros guardados.</div>
                            </template>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </template>

</div>

<!-- Firebase SDKs (Compatibles con ES Modules vía CDN) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDnD92lAkZYsP9mgIDolabWl-vM_VHmy4I",
        authDomain: "bitacora-brasil-2027.firebaseapp.com",
        projectId: "bitacora-brasil-2027",
        storageBucket: "bitacora-brasil-2027.firebasestorage.app",
        messagingSenderId: "52440050546",
        appId: "1:52440050546:web:4cc3fd107b5b6b900dcbeb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firebaseFirestore = { doc, getDoc, setDoc };

    window.dispatchEvent(new CustomEvent('firebase-ready'));
</script>

<script>
    function gestorApp() {
        return {
            isAuthenticated: false,
            currentUser: '',
            credentials: { user: '', password: '' },
            loginError: '',

            nuevo: { rubro: 'Ingresos diarios', fecha: '', monto: null, medio: 'Efectivo' },
            nuevaMetaNombre: '',
            nuevaMetaMonto: null,
            totalGeneral: 0, totalEfectivo: 0, totalBelo: 0,
            historial: [],
            rubros: {
                'Ingresos diarios': { acumulado: 0, meta: 100000, color: 'bg-blue-500' },
                'Cursos de Formación': { acumulado: 0, meta: 50000, color: 'bg-purple-500' },
                'Ingresos Consultas por semana': { acumulado: 0, meta: 80000, color: 'bg-amber-500' },
                'Ingresos Ventas Texto': { acumulado: 0, meta: 30000, color: 'bg-emerald-500' },
                'Ingreso SAC 2': { acumulado: 0, meta: 30000, color: 'bg-rose-500' }
            },

            init() {
                const session = sessionStorage.getItem('vb2027_session');
                if (session) {
                    this.isAuthenticated = true;
                    this.currentUser = session;
                    this.esperarFirebaseYcargar();
                }
                this.renderIcons();
            },

            esperarFirebaseYcargar() {
                if (window.db) {
                    this.cargarDatosApp();
                } else {
                    window.addEventListener('firebase-ready', () => {
                        this.cargarDatosApp();
                    });
                }
            },

            login() {
                this.loginError = '';
                if (this.credentials.user === 'Drpereyra' && this.credentials.password === '235689') {
                    this.isAuthenticated = true;
                    this.currentUser = this.credentials.user;
                    sessionStorage.setItem('vb2027_session', this.currentUser);
                    this.credentials = { user: '', password: '' };
                    this.esperarFirebaseYcargar();
                } else {
                    this.loginError = 'Usuario o contraseña incorrectos.';
                    this.credentials.password = '';
                }
            },

            logout() {
                this.isAuthenticated = false;
                this.currentUser = '';
                sessionStorage.removeItem('vb2027_session');
                this.renderIcons();
            },

            async cargarDatosApp() {
                try {
                    const { doc, getDoc } = window.firebaseFirestore;
                    const docRef = doc(window.db, "contabilidad", "brasil2027");
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        this.historial = data.historial || [];
                        if (data.rubros) {
                            // Reconstruir rubros preservando colores e integrando metas guardadas
                            const rubrosCargados = {};
                            const coloresDisponibles = ['bg-blue-500', 'bg-purple-500', 'bg-amber-500', 'bg-emerald-500', 'bg-rose-500', 'bg-indigo-500', 'bg-teal-500'];
                            let i = 0;
                            for (let r in data.rubros) {
                                rubrosCargados[r] = {
                                    acumulado: 0,
                                    meta: data.rubros[r].meta,
                                    color: this.rubros[r]?.color || coloresDisponibles[i % coloresDisponibles.length]
                                };
                                i++;
                            }
                            if (Object.keys(rubrosCargados).length > 0) {
                                this.rubros = rubrosCargados;
                            }
                        }
                    }
                } catch (error) {
                    console.error("Error al cargar desde Firebase:", error);
                }

                this.calcularTotales();
                this.nuevo.fecha = new Date().toISOString().split('T')[0];
                this.renderIcons();
            },

            renderIcons() {
                setTimeout(() => {
                    if (typeof lucide !== 'undefined') {
                        lucide.createIcons();
                    }
                }, 50);
            },

            agregarIngreso() {
                if(this.nuevo.monto <= 0 || !this.nuevo.monto) return;
                this.historial.unshift({ ...this.nuevo });
                this.guardarDatos();
                this.nuevo.monto = null;
            },

            eliminarIngreso(index) {
                if(confirm('¿Eliminar este registro?')) {
                    this.historial.splice(index, 1);
                    this.guardarDatos();
                }
            },

            agregarMeta() {
                const nombre = this.nuevaMetaNombre.trim();
                if(!nombre || !this.nuevaMetaMonto || this.nuevaMetaMonto <= 0) {
                    alert("Por favor ingrese un nombre y un monto válido para la nueva meta.");
                    return;
                }
                if(this.rubros[nombre]) {
                    alert("Ya existe una meta con ese nombre.");
                    return;
                }
                const coloresDisponibles = ['bg-blue-500', 'bg-purple-500', 'bg-amber-500', 'bg-emerald-500', 'bg-rose-500', 'bg-indigo-500', 'bg-teal-500'];
                const colorAleatorio = coloresDisponibles[Math.floor(Math.random() * coloresDisponibles.length)];
                
                this.rubros[nombre] = {
                    acumulado: 0,
                    meta: parseFloat(this.nuevaMetaMonto),
                    color: colorAleatorio
                };

                this.nuevaMetaNombre = '';
                this.nuevaMetaMonto = null;
                this.guardarDatos();
            },

            eliminarMeta(rubro) {
                if(confirm(`¿Estás seguro de eliminar la meta "${rubro}"?`)) {
                    delete this.rubros[rubro];
                    // Si el select de nuevo ingreso apuntaba a este rubro, lo reasignamos si es posible
                    const remainingRubros = Object.keys(this.rubros);
                    if(remainingRubros.length > 0 && !this.rubros[this.nuevo.rubro]) {
                        this.nuevo.rubro = remainingRubros[0];
                    }
                    this.guardarDatos();
                }
            },

            calcularTotales() {
                for (let r in this.rubros) { this.rubros[r].acumulado = 0; }
                this.totalGeneral = 0; this.totalEfectivo = 0; this.totalBelo = 0;

                this.historial.forEach(item => {
                    const montoNum = parseFloat(item.monto);
                    if (this.rubros[item.rubro]) {
                        this.rubros[item.rubro].acumulado += montoNum;
                    }
                    this.totalGeneral += montoNum;
                    if (item.medio === 'Efectivo') this.totalEfectivo += montoNum;
                    if (item.medio === 'BELO') this.totalBelo += montoNum;
                });
            },

            async guardarDatos() {
                this.calcularTotales();
                try {
                    const { doc, setDoc } = window.firebaseFirestore;
                    const docRef = doc(window.db, "contabilidad", "brasil2027");
                    
                    const rubrosParaGuardar = {};
                    for (let r in this.rubros) {
                        rubrosParaGuardar[r] = { meta: this.rubros[r].meta };
                    }

                    await setDoc(docRef, {
                        historial: this.historial,
                        rubros: rubrosParaGuardar
                    });
                    alert("¡Metas y datos guardados exitosamente en la base de datos!");
                } catch (error) {
                    console.error("Error al guardar en Firebase:", error);
                    alert("Hubo un error al sincronizar con la base de datos.");
                }
            },

            exportarDatos() {
                const dataStr = JSON.stringify({ historial: this.historial, rubros: this.rubros });
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = `backup_brasil_2027_${new Date().toISOString().split('T')[0]}.json`;
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            },

            importarDatos(event) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        if (json.historial && json.rubros) {
                            this.historial = json.historial;
                            this.rubros = {};
                            const coloresDisponibles = ['bg-blue-500', 'bg-purple-500', 'bg-amber-500', 'bg-emerald-500', 'bg-rose-500'];
                            let i = 0;
                            for (let r in json.rubros) {
                                this.rubros[r] = {
                                    acumulado: 0,
                                    meta: json.rubros[r].meta,
                                    color: coloresDisponibles[i % coloresDisponibles.length]
                                };
                                i++;
                            }
                            await this.guardarDatos();
                            alert("¡Backup restaurado y sincronizado con la base de datos!");
                        }
                    } catch (err) { 
                        alert("Error al leer el archivo de backup."); 
                    }
                };
                reader.readAsText(event.target.files[0]);
            },

            formatearMoneda(valor) {
                return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor || 0);
            },

            formatearFecha(f) {
                return new Date(f + 'T12:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
            }
        }
    }
</script>
